name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The floor is requires-python in pyproject.toml; the ceiling is the
        # newest release the pinned grpcio/protobuf publish wheels for.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e '.[dev]'

      - name: Typecheck
        run: python -m mypy

      # examples/ sits outside the packages list in [tool.mypy], so it needs
      # naming explicitly or it is never checked.
      - name: Typecheck examples
        run: python -m mypy --strict examples/

      - name: Test
        run: python -m pytest
